name: 기능 제안
description: 새로운 기능을 제안해주세요!
title: "[Feature] "
labels: ["type: feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 기능 제안 가이드
        어떤 기능이 필요한지 자세히 설명해주세요.

  - type: dropdown
    id: platform
    attributes:
      label: 대상
      description: 어디를 고쳐야 하나요? 서버만으로 끝나지 않는 일이 많습니다
      options:
        - 서버
        - 앱
        - 웹
        - 전체
      multiple: true
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: 명세
      description: 기능명세서의 Func 번호. 명세에 없으면 비워두세요
      placeholder: "Func-002-02"

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - "1 (3차 평가에 필요)"
        - "2 (있으면 좋음)"
        - "3 (나중에)"
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: 기능 설명
      description: 어떤 기능을 추가하고 싶으신가요?
      placeholder: "예: 그룹장이 카테고리별로 확정할 장소 수를 정하는 기능"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하고자 하는 문제
      description: 이 기능이 왜 필요한가요? 어떤 불편함을 해결하나요?
      placeholder: "예: 지금은 투표가 끝나도 몇 곳을 확정할지 정할 방법이 없어 일정 초안을 만들 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 지금 코드는 어떤가요 (AS-IS)
      description: |
        관련된 코드가 현재 어떻게 동작하는지, 파일과 줄 번호를 적어주세요.
        이게 없으면 리뷰할 때 무엇이 달라지는지 알 수 없습니다
      placeholder: |
        예: 여행이 없으면 서버가 dday 에 "쉬는 중" 문자열을 내려줍니다
        (main/service/TravelPlanService.java:83)
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 어떻게 동작하면 좋을까요?
      placeholder: |
        예:
        1. 플래너를 만들 때 카테고리별 확정 개수를 입력받는다
        2. 투표 마감 시 그 개수만큼 상위 장소를 확정한다
        3. 동점이면 그룹장이 고른다
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: 정해야 할 것
      description: |
        혼자 정하면 안 되는 것. 응답 형식이 바뀌거나, 앱·웹도 같이 고쳐야 하거나,
        비용이 드는 선택이면 여기에 적고 팀에서 정한 뒤에 시작하세요
      placeholder: "예: 문구를 서버가 줄지 앱이 정할지"

  - type: input
    id: blocked-by
    attributes:
      label: 선행 이슈
      description: 이것보다 먼저 끝나야 하는 이슈
      placeholder: "#130"

  - type: textarea
    id: mockup
    attributes:
      label: 디자인 또는 참고 자료
      description: 피그마 링크, UI 스케치, 참고할 만한 다른 서비스 등

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝인가요. 이게 없으면 담당자가 어디까지 해야 하는지 모릅니다
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
